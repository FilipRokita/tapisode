name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tapisode
          POSTGRES_PASSWORD: tapisode
          POSTGRES_DB: tapisode_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tapisode" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tapisode:tapisode@localhost:5432/tapisode_test
      DATABASE_URL: postgresql://tapisode:tapisode@localhost:5432/tapisode_test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
      MEDIA_PROVIDER: fake
      LEGAL_CONTROLLER_NAME: Test Controller
      LEGAL_CONTACT_EMAIL: legal@example.test
      CRON_SECRET: ci-cron-secret-ci-cron-secret-ci-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:colors
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run db:seed
      - run: npm run test:e2e
      - run: CHROME_PATH=$(node -p "require('@playwright/test').chromium.executablePath()") npx lhci autorun
